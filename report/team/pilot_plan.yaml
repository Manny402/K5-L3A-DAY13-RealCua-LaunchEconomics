# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Nhóm RealCua · L3A. Số tính bằng src/lab13.py (hàm co_mau, in_bang_d).
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm (statsmodels NormalIndPower cho 1.250, lệch < 2%).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; 1.251 × 2,48 = 3.103 mỗi nhóm = 42 nhân viên mỗi nhóm,
#      tổng 84 > 40 nhân viên: không đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251: không đạt mức 5 điểm.
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa 6 / 0,02 = 300; chỉ 6 cụm, loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m ≥ 859 × (0,98 + 0,02m) → 2,82m ≥ 841,82
#      → m ≥ 299 yêu cầu mỗi nhân viên (DE 6,96).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (chia theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với nhóm dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: bốc thăm bằng code với seed ghi trước (seed 20261207), phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: rủi ro chia sẻ câu trả lời trong depot; quyền truy cập theo tài khoản,
#      log lượt mở trợ lý theo staff_id, báo cáo % yêu cầu nhóm đối chứng có lượt mở trợ lý (ngưỡng 0%).
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: có, chốt trong file này trước ngày bắt đầu 2026-12-07.
#   5. Ít nhất 20 cụm mỗi nhóm: có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên không cách chia theo cụm nào thấy được mức 5 điểm (tối đa 1.000 < 1.251). Nhóm chọn
#   chia theo nhân viên và chấp nhận mức chênh tối thiểu phát hiện được là 6 điểm (859/nhóm, m ≥ 299 yêu cầu
#   mỗi nhân viên). Nếu tác động thật chỉ là 5 điểm, power chỉ còn khoảng 0,64. Giám đốc vận hành ký chấp nhận.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   4,25% (51/1.200) toàn mẫu; 3,97% (39/982) trong phạm vi noi_dia + hang_nang. Ngưỡng tuyệt đối 3% sẽ
#   dừng pilot ngay tuần đầu, nên dùng: nhóm trợ lý cao hơn đối chứng ≥ 2 điểm, kèm trần tuyệt đối 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ loai noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated), cả 12 depot; loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 → 10 → 20 nhân viên nhóm trợ lý; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 5 điểm cần 1.251/nhóm, vượt trần 1.000 của 20 cụm
    alpha: 0.05
    power: 0.80
    n_per_arm: 859                # cỡ mẫu hiệu dụng; tương ứng ≥ 299 yêu cầu mỗi nhân viên, 5.980 yêu cầu mỗi nhóm
    design_effect: 6.96           # 1 + (299 − 1) × 0,02
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng chạy cùng tuần, cùng depot; bốc thăm bằng code, seed 20261207, phân tầng theo depot"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, mde 0,06, ba luật dừng và ngày quyết định chốt trong file này trước ngày bắt đầu 2026-12-07"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng ≥ 2 điểm hoặc vượt 6%, hoặc có ≥ 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và Kỹ sư trưởng agent rà toàn bộ trace liên quan trong 24 giờ KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công (đo bằng phút thật) > 8.000 đ hoặc tỉ lệ làm lại > 7% TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được giữ hang_nang trong phạm vi"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên nhóm trợ lý trong 3 ngày làm việc KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn (mở lại 7 ngày, hoàn trùng) hằng ngày; không xem chỉ số chính trước ngày quyết định"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; yêu cầu đang mở được chuyển về luồng nhân viên tự làm kèm tóm tắt theo trace_id"
  decision_date: "2027-01-11"
  simulated_inputs:
    - "phut_xem_lai_simulated: 890 phút, 1.780.000 đ"
    - "phut_lam_lai_simulated: 1.132 phút, 2.264.000 đ"
    - "Chi phí mỗi việc thành công 4.472 đ (toàn mẫu) và 3.414 đ (phạm vi noi_dia + hang_nang)"
    - "Chi phí theo loại: noi_dia 2.696 đ, hang_nang 8.221 đ, quoc_te 22.515 đ, doi_tac 10.215 đ"
    - "Chi phí cố định cộng vào: 4.599 đ ở 45.000 yêu cầu/tháng, 5.784 đ ở một nửa khối lượng"
    - "Xem lại 100%: 11.743 đ = 0,98× (12.415 đ = 1,03× nếu làm lại 15,3 phút/ca)"
    - "Ngưỡng 8.000 đ trong luật dừng chi phí suy ra từ bảng độ nhạy (làm lại gấp đôi: 6.787 đ)"
